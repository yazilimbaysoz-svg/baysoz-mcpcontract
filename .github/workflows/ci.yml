name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Tests, lint and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Create environment and install project
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest

      - name: Unit and integration tests
        run: uv run pytest -q

      - name: Ruff quality gate
        run: uv run --with ruff ruff check --select E,F,W,S,B .

      - name: Semgrep security gate
        run: uv run --with semgrep semgrep --config p/default --error .

      - name: Self-check the reference manifest
        run: uv run mcpcontract check tests/fixtures/tools_clean.json --profile enterprise-strict --format text
